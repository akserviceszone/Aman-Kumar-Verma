<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.K SERVICES - Digital Service Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172554}
header{background:#102b55;color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}
.container{max-width:430px;margin:35px auto;padding:15px}
.card{background:white;padding:25px;border-radius:14px;box-shadow:0 5px 22px #0001}
h2{text-align:center;color:#12366b}
input,select{width:100%;padding:13px;margin:9px 0;border:1px solid #cbd5e1;border-radius:7px;font-size:15px}
button{width:100%;padding:13px;background:#1455a0;color:white;border:0;border-radius:7px;font-size:16px;margin-top:10px;cursor:pointer}
button:hover{background:#0c3971}
.link{text-align:center;margin-top:18px;color:#1455a0;cursor:pointer}
.hidden{display:none}
footer{text-align:center;padding:25px;color:#64748b}
</style>
</head>
<body>

<header>
<h1>A.K SERVICES</h1>
<p>Digital Service & Retailer Portal</p>
</header>

<div class="container">

<div class="card" id="loginBox">
<h2>Welcome Back</h2>
<p style="text-align:center">Login to your account</p>

<form id="loginForm">
<input type="email" id="email" placeholder="Email Address" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">LOGIN</button>
</form>

<div class="link" onclick="showRegister()">Create New Account</div>
</div>

<div class="card hidden" id="registerBox">
<h2>Create Account</h2>
<form id="registerForm">
<input id="fullName" placeholder="Full Name" required>
<input id="phone" placeholder="Mobile Number" required>
<input type="email" id="regEmail" placeholder="Email Address" required>
<input type="password" id="regPassword" placeholder="Password (Minimum 6 Characters)" minlength="6" required>
<button type="submit">REGISTER</button>
</form>
<div class="link" onclick="showLogin()">Back to Login</div>
</div>

<div class="card hidden" id="dashboard">
<h2>A.K SERVICES Dashboard</h2>
<p id="userInfo"></p>
<p id="userRole"></p>
<p id="approvalInfo"></p>
<button onclick="logout()">LOGOUT</button>
</div>

</div>

<footer>© 2026 A.K SERVICES | Trust • Honesty • Quality</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ENTER YOUR SUPABASE PROJECT URL AND ANON/PUBLISHABLE KEY BELOW
const SUPABASE_URL = https://wxacdymlbxrrvhxhhzrc.supabase.co/rest/v1/
const SUPABASE_KEY = sb_publishable_vbWtl2hOd7LIvNDHVSQSTA_CjdIiluV
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

window.showRegister = () => {
 document.getElementById('loginBox').classList.add('hidden');
 document.getElementById('registerBox').classList.remove('hidden');
};

window.showLogin = () => {
 document.getElementById('registerBox').classList.add('hidden');
 document.getElementById('loginBox').classList.remove('hidden');
};

function showMessage(message) {
 alert(message);
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
 e.preventDefault();

 const full_name = document.getElementById('fullName').value.trim();
 const phone = document.getElementById('phone').value.trim();
 const email = document.getElementById('regEmail').value.trim();
 const password = document.getElementById('regPassword').value;

 const { data, error } = await supabase.auth.signUp({
  email,
  password,
  options: { data: { full_name, phone } }
 });

 if (error) return showMessage(error.message);

 showMessage('Registration submitted. Verify your email if requested. Your account will remain pending until approved.');
 e.target.reset();
 window.showLogin();
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
 e.preventDefault();

 const email = document.getElementById('email').value.trim();
 const password = document.getElementById('password').value;

 const { data, error } = await supabase.auth.signInWithPassword({
  email,
  password
 });

 if (error) return showMessage(error.message);

 await loadDashboard(data.user);
});

async function loadDashboard(user) {
 const { data: profile, error } = await supabase
  .from('profiles')
  .select('full_name, role, approval_status')
  .eq('id', user.id)
  .maybeSingle();

 if (error) return showMessage(error.message);

 if (!profile) {
  showMessage('Profile not found. Please contact Admin.');
  return;
 }

 document.getElementById('loginBox').classList.add('hidden');
 document.getElementById('registerBox').classList.add('hidden');
 document.getElementById('dashboard').classList.remove('hidden');

 document.getElementById('userInfo').textContent =
  'Welcome, ' + (profile.full_name || user.email);

 document.getElementById('userRole').textContent =
  'Account Type: ' + profile.role;

 document.getElementById('approvalInfo').textContent =
  'Account Status: ' + profile.approval_status;
}

window.logout = async () => {
 await supabase.auth.signOut();
 document.getElementById('dashboard').classList.add('hidden');
 document.getElementById('loginBox').classList.remove('hidden');
};

const { data: sessionData } = await supabase.auth.getSession();
if (sessionData.session) {
 await loadDashboard(sessionData.session.user);
}
 window.showRegister = () => {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('registerBox').classList.remove('hidden');
};

window.showLogin = () => {
    document.getElementById('registerBox').classList.add('hidden');
    document.getElementById('loginBox').classList.remove('hidden');
};
</script>

</body>
</html>
